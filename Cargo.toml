[package]
name = "paystack-rs"
version = "1.6.0"
description = "Paystack API Wrapper"
authors = ["Oghenemarho Orukele <orukele.dev@gmail.com>"]
edition = "2021"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENCE"]
homepage = "https://github.com/morukele/paystack-rs"
repository = "https://github.com/morukele/paystack-rs"
documentation = "https://docs.rs/paystack-rs"
keywords = ["payment", "paystack", "api", "finance", "async"]
readme = "README.md"
categories = ["api-bindings", "finance"]
license = "MIT"

[lib]
name = "paystack"

[dependencies]
thiserror = "2.0.17"
serde_json = "1.0.145"
reqwest = { version = "0.12.25", features = ["json"] }
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.29"
async-trait = "0.1.89"
derive_builder = "0.20.2"
time = { version = "0.3", features = ["macros", "serde", "formatting"] }

[dev-dependencies]
fake = "4.4.0"
rand = "0.9.2"
dotenv = "0.15.0"
